<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="adminSidebar">

        <p class="nav-label">CONTROL CENTER</p>
        <nav class="admin-nav">
          <button class="active" data-admin-route="overview"><span>⌁</span>운영 현황</button>
          <button data-admin-route="submissions"><span>✓</span>제출 검사</button>
          <button data-admin-route="curriculum"><span>◇</span>커리큘럼 관리</button>
          <button data-admin-route="assignments"><span>⌘</span>과제 관리</button>

        <section class="admin-content" id="adminApp"><div class="loading-screen"><span>AUTHORIZING</span></div></section>
      </main>

    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="닫기">×</button><div id="modalContent"></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="backend.js"></script>
    <script src="activity-model.js"></script>
    <script src="admin.js"></script>
